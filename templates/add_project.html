{% extends 'base.html' %}

{% block title %}Add Project{% endblock %}

{% block content %}
  <section class="form-shell">
    <h1>Add New Project</h1>
    <form method="post" class="project-form">
      <label>
        Project Title
        <input type="text" name="title" placeholder="Enter project name" required />
      </label>

      <label>
        Description
        <textarea name="description" rows="5" placeholder="Describe your project details"></textarea>
      </label>

      <label>
        Status
        <select name="status">
          <option value="Open">Open</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
      </label>

      <div class="form-actions">
        <button type="submit" class="button primary">Save Project</button>
        <a href="{{ url_for('index') }}" class="button secondary">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
